<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINA · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · LUMINA</p>
    <h1>Where a question goes, and who holds the keys</h1>

      <title id="architecture-dark-title">LUMINA system architecture</title>
      <desc id="architecture-dark-desc">Architecture diagram: a browser on Vercel calls the public gateway on Fly.io, which proxies to a private agent service holding every provider key; the agent reaches MongoDB Atlas, Anthropic, OpenAI and Tavily, and a forked jobs worker indexes uploaded documents through the same database.</desc>

      </defs>

      <text x="448" y="109" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FLY.IO · IAD</text>

      <rect x="656" y="96" width="264" height="424" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <rect x="740" y="100" width="96" height="12" rx="2" fill="#2d3142"/>
      <text x="788" y="109" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MANAGED</text>

      <path d="M 600,456 H 780 Q 788,456 788,448 V 360" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="456" y="238" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="496" y="247" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">.INTERNAL:8000</text>

      <rect x="604" y="298" width="80" height="12" rx="2" fill="#2d3142"/>

      <text x="448" y="312" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent service</text>
      <text x="448" y="328" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quick + deep loops · 6 tools</text>
      <text x="448" y="344" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caps · spend gates · no route</text>

      <!-- Node: Jobs worker -->
      <rect x="320" y="424" width="256" height="64" rx="6" fill="#2d3142"/>
      <rect x="320" y="424" width="256" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="328" y="432" width="36" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="346" y="441" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="448" y="460" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jobs worker</text>
      <text x="448" y="476" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parse · chunk · embed · probe</text>

      <!-- Node: Anthropic -->
      <rect x="688" y="176" width="200" height="64" rx="6" fill="#2d3142"/>

      <text x="788" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sonnet-5 · haiku-4.5</text>

      <text x="788" y="354" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GridFS · runs · cache</text>

      <text x="710" y="441" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="788" y="460" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tavily · OpenAI</text>
      <text x="788" y="476" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · embeddings</text>

      <rect x="356" y="596" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="376" y="604" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="448" y="596" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>

  </div>
