<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINA · Document ingestion</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · LUMINA</p>
    <h1>A document is not indexed until the probe says so</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingestion-lifecycle-dark-title ingestion-lifecycle-dark-desc">
      <title id="ingestion-lifecycle-dark-title">Document ingestion lifecycle</title>
      <desc id="ingestion-lifecycle-dark-desc">State machine for an uploaded document: pending after a 202, then parsing, embedding and probing on the jobs worker; it reaches indexed only after a read-your-write probe returns one of its own chunks, fails after three attempts, and returns to pending when a worker dies mid-job and the sweeper finds a stale claim.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Transitions -->
      <line x1="52" y1="180" x2="88" y2="180" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="248" y1="180" x2="316" y2="180" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="476" y1="180" x2="544" y2="180" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="180" x2="772" y2="180" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="848" y1="228" x2="848" y2="316" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 884 148 L 920 148 L 920 116 L 884 116" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="228" x2="620" y2="316" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="396" x2="620" y2="436" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 772,356 H 644 Q 636,356 636,364 V 436" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 396 136 C 396 72, 168 72, 168 136" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="92" y="156" width="152" height="12" rx="2" fill="#2d3142"/>
      <text x="168" y="165" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">202 IN 137MS · JOB ROW</text>

      <rect x="252" y="156" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="284" y="165" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>

      <rect x="480" y="156" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="512" y="165" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHUNK</text>

      <rect x="708" y="156" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="740" y="165" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

      <rect x="860" y="252" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="904" y="261" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHUNK RETURNED</text>

      <rect x="880" y="96" width="76" height="12" rx="2" fill="#2d3142"/>
      <text x="918" y="105" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT YET · 1.5S</text>

      <rect x="632" y="252" width="116" height="12" rx="2" fill="#2d3142"/>
      <text x="690" y="261" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 ATTEMPTS SPENT</text>

      <rect x="632" y="408" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="656" y="417" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERROR</text>

      <rect x="704" y="332" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="736" y="341" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CITABLE</text>

      <rect x="228" y="68" width="136" height="12" rx="2" fill="#2d3142"/>
      <text x="296" y="77" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STALE CLAIM · SWEPT</text>

      <!-- Start dot -->
      <circle cx="44" cy="180" r="6" fill="#f5f5f5"/>

      <!-- State: pending -->
      <rect x="88" y="136" width="160" height="88" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="96" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="116" y="153" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="168" y="184" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pending</text>
      <text x="168" y="202" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in GridFS · queued</text>

      <!-- State: parsing -->
      <rect x="316" y="136" width="160" height="88" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="324" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="344" y="153" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="396" y="184" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">parsing</text>
      <text x="396" y="202" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pdfjs · page-aware</text>

      <!-- State: embedding -->
      <rect x="544" y="136" width="160" height="88" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="552" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="572" y="153" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="624" y="184" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">embedding</text>
      <text x="624" y="202" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">64 per batch</text>

      <!-- State: probing -->
      <rect x="772" y="136" width="152" height="88" rx="8" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="780" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
      <text x="800" y="153" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="848" y="184" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">probing</text>
      <text x="848" y="202" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-your-write</text>

      <!-- State: indexed (focal) -->
      <rect x="772" y="316" width="152" height="80" rx="8" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <rect x="780" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="800" y="333" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="848" y="360" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">indexed</text>
      <text x="848" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pct 100 · searchable</text>

      <!-- State: failed -->
      <rect x="540" y="316" width="160" height="80" rx="8" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="548" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
      <text x="568" y="333" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="620" y="360" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">failed</text>
      <text x="620" y="378" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error string kept</text>

      <!-- End ring dot -->
      <circle cx="628" cy="452" r="8" fill="none" stroke="#f5f5f5" stroke-width="1"/>
      <circle cx="628" cy="452" r="5" fill="#f5f5f5"/>

      <!-- Legend strip -->
      <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="536" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="60" y="544" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Earned by the probe</text>

      <rect x="216" y="536" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="236" y="544" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Worker stage</text>

      <rect x="356" y="536" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="376" y="544" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Wait or terminal</text>

      <line x1="512" y1="542" x2="540" y2="542" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="548" y="544" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>

      <line x1="664" y1="542" x2="692" y2="542" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="700" y="544" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Recovery / retained</text>
    </svg>
  </div>
</body>
</html>
