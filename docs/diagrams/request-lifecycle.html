<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINA · Request lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · LUMINA</p>
    <h1>One question, two gears</h1>

    <svg viewBox="0 0 960 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc">
      <title id="request-lifecycle-title">LUMINA request lifecycle, quick and deep</title>
      <desc id="request-lifecycle-desc">Sequence diagram of an answer: the browser posts a question to the gateway, which proxies to the agent; the agent searches with Tavily and synthesises with Anthropic, streaming sources before the first token. An alt fragment contrasts the quick gear with the deep gear, which plans sub-questions before any retrieval.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines: browser 96, gateway 304, agent 496, tavily 704, anthropic 880 -->
      <line x1="96" y1="128" x2="96" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="304" y1="128" x2="304" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="496" y1="128" x2="496" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="704" y1="128" x2="704" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- alt fragment spanning agent..anthropic -->
      <rect x="440" y="256" width="480" height="260" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="448" y1="404" x2="912" y2="404" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="440" y="256" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="460" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="492" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[depth = quick · the default]</text>
      <text x="492" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[depth = deep · opted into, never drifted into]</text>

      <!-- Activation bars -->
      <rect x="300" y="180" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="492" y="212" width="8" height="332" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="96" y1="176" x2="300" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="308" y1="212" x2="492" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="320" x2="700" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="352" x2="500" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="500" y1="384" x2="876" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="448" x2="876" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="480" x2="700" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- sources before the first token, then the streamed answer (coral headline) -->
      <line x1="492" y1="544" x2="308" y2="544" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="300" y1="576" x2="96" y2="576" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Message labels -->
      <rect x="128" y="156" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /THREADS/:ID/ASK</text>

      <rect x="332" y="192" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="398" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">401 · ZOD · 429 · PROXY</text>

      <rect x="528" y="300" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEB_SEARCH · 1 CREDIT</text>

      <rect x="528" y="332" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="598" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS + PAGE TEXT</text>

      <rect x="600" y="364" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNTHESISE · SONNET-5</text>

      <rect x="600" y="428" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="437" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAN_RESEARCH · HAIKU</text>

      <rect x="528" y="460" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAN OUT · 4 SUB-QUESTIONS</text>

      <rect x="336" y="524" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="398" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOURCES · THEN TRACE</text>

      <rect x="132" y="556" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="565" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN · · · DONE</text>

      <!-- Actors (drawn after arrows) -->
      <rect x="24" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="32" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="46" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="96" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="96" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">x-user-id</text>

      <rect x="232" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="304" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway</text>
      <text x="304" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8787 · public</text>

      <rect x="416" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="72" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="424" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="440" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEYS</text>
      <text x="496" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent service</text>
      <text x="496" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private · the loop</text>

      <rect x="632" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="640" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="654" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="704" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tavily</text>
      <text x="704" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · extract</text>

      <rect x="808" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="808" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="816" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="830" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="880" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anthropic</text>
      <text x="880" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sonnet · haiku</text>

      <!-- Legend strip -->
      <line x1="40" y1="628" x2="920" y2="628" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="670" x2="68" y2="670" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="76" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Browser call</text>

      <line x1="196" y1="670" x2="224" y2="670" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="232" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

      <line x1="332" y1="670" x2="360" y2="670" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="368" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="460" y1="670" x2="488" y2="670" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="496" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Streamed answer</text>

      <rect x="644" y="664" width="14" height="10" rx="2" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="664" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Holds control</text>

      <rect x="784" y="664" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="804" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch by depth</text>
    </svg>
  </div>
</body>
</html>
